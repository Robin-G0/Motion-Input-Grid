name: Prepare release candidates

on:
    push:
        tags: ['v*.*.*']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    metadata:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Propagate exact-tag package versions
              run: python3 tools/release/release-version.py --sync
            - name: Verify package versions and release tag
              env:
                  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
              run: |
                  python3 tools/release/release-version.py --sync ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
                  python3 tools/dev/check-docs.py
                  python3 tests/tooling/version_resolution_tests.py

    linux:
        needs: metadata
        outputs:
            artifact-id: ${{ steps.candidates.outputs.artifact-id }}
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Propagate exact-tag package versions
              run: python3 tools/release/release-version.py --sync
            - name: Cache Linux compiler results
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: build/ccache-linux
                  key: release-ccache-linux-${{ hashFiles('tools/docker/linux-release.Dockerfile') }}-${{ github.sha }}
                  restore-keys: release-ccache-linux-${{ hashFiles('tools/docker/linux-release.Dockerfile') }}-
            - name: Cache verified Linux downloads
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: |
                      build/native-linux-deps/mediapipe.whl
                      build/native-linux-deps/models
                  key: release-downloads-linux-${{ hashFiles('tools/bootstrap/bootstrap-native-linux.py') }}
            - name: Build baseline toolchain
              run: docker build -f tools/docker/linux-release.Dockerfile -t mig-linux-release:22.04 tools
            - name: Build, test and package x64 and ARM64 SDKs
              run: >-
                  docker run --rm -v "$PWD:/src" -w /src
                  -e CCACHE_DIR=/src/build/ccache-linux -e CCACHE_MAXSIZE=500M
                  -e CMAKE_CXX_COMPILER_LAUNCHER=ccache mig-linux-release:22.04
                  bash tools/build/build-linux-release.sh
            - name: Validate native tutorials without the repository or development libraries
              run: |
                  docker build -f tools/docker/linux-example-test.Dockerfile -t mig-example-test:22.04 tools
                  docker run --rm --init \
                      -v "$PWD/build/releases:/archives:ro" \
                      -v "$PWD/tests/packaging/standalone_example_tests.py:/tests/standalone_example_tests.py:ro" \
                      mig-example-test:22.04 xvfb-run -a python3 -u /tests/standalone_example_tests.py \
                      '/archives/*-linux-x64-*-standalone.tar.gz'
            - name: Generate and validate SDK and Python packages
              run: >-
                  docker run --rm -v "$PWD:/src" -w /src
                  -e CCACHE_DIR=/src/build/ccache-linux -e CCACHE_MAXSIZE=500M
                  -e CMAKE_CXX_COMPILER_LAUNCHER=ccache mig-linux-release:22.04
                  bash tools/packaging/prepare-linux-packages.sh
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              id: candidates
              with:
                  name: motion-input-grid-linux-and-python-candidates
                  path: |
                      build/releases/
                      !build/releases/motion-input-grid-*-linux-x64-examples.tar.gz*
                      !build/releases/SHA256SUMS
                  # Keep inputs for debugging if assembly fails; delete after successful assembly.
                  retention-days: 3
                  if-no-files-found: error
                  compression-level: 1

    windows:
        needs: metadata
        outputs:
            artifact-id: ${{ steps.candidates.outputs.artifact-id }}
        runs-on: windows-2022
        timeout-minutes: 60
        env:
            CMAKE_BUILD_PARALLEL_LEVEL: 3
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: |
                      tools/packaging/freeze-python-examples.py
                      tools/packaging/prepare-windows-packages.ps1
                      bindings/python/pyproject.toml
            - name: Propagate exact-tag package versions
              run: python tools/release/release-version.py --sync
            - name: Cache verified Windows downloads
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: |
                      build/native-deps/mediapipe.zip
                      build/native-deps/models
                      build/example-deps/*.zip
                  key: release-downloads-windows-${{ hashFiles('tools/bootstrap/bootstrap-native.ps1', 'tools/build/build-examples.ps1') }}
            - name: Test download recovery and integrity checks
              shell: pwsh
              run: ./tests/tooling/download_tests.ps1
            - name: Build and test Windows x64
              shell: pwsh
              run: ./tools/build/build-windows.ps1
            - name: Package Windows x64
              shell: pwsh
              run: |
                  ./tools/packaging/package-distribution.ps1
                  ./tools/packaging/package-windows-release.ps1
                  python tests/packaging/controller_package_tests.py
                  if ($LASTEXITCODE -ne 0) { throw 'Controller packaging tests failed.' }
                  python tests/packaging/pe_dependency_tests.py
                  if ($LASTEXITCODE -ne 0) { throw 'Windows DLL dependency checks failed.' }
                  $version = (Get-Content VERSION -Raw).Trim()
                  python tests/packaging/controller_runtime_tests.py "build/releases/motion-input-grid-$version-controller-windows-x64.exe"
                  if ($LASTEXITCODE -ne 0) { throw 'Standalone Controller diagnostics failed.' }
                  cmake --install build/windows --config Release --prefix build/examples-sdk/windows
                  ./tools/build/build-examples.ps1
                  python -m pip install pyinstaller==6.16.0 pillow==11.3.0 pygame==2.6.1
                  python tools/packaging/freeze-python-examples.py
                  python tools/packaging/package-examples.py --platform windows-x64 --standalone
                  python tests/packaging/standalone_example_tests.py --source-python python build/releases/*-windows-x64-*-standalone.zip
            - name: Build and validate SDK and Python artifacts
              shell: pwsh
              run: ./tools/packaging/prepare-windows-packages.ps1
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              id: candidates
              with:
                  name: motion-input-grid-windows-x64-candidate
                  path: |
                      build/releases/
                      !build/releases/motion-input-grid-*-windows-x64-examples.zip*
                      !build/releases/SHA256SUMS
                  retention-days: 3
                  if-no-files-found: error
                  compression-level: 1

    javascript:
        needs: metadata
        outputs:
            artifact-id: ${{ steps.candidates.outputs.artifact-id }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Propagate exact-tag package versions
              run: python3 tools/release/release-version.py --sync
            - name: Set up cached Emscripten 4.0.15
              uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e # v15
              with:
                  version: '4.0.15'
                  actions-cache-folder: build/emsdk-cache
                  cache-key: emsdk-4.0.15-${{ runner.os }}-${{ runner.arch }}
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
            - name: Install compatible CMake
              run: |
                  python3 -m venv "$RUNNER_TEMP/mig-cmake"
                  "$RUNNER_TEMP/mig-cmake/bin/python" -m pip install cmake==3.31.10
                  echo "$RUNNER_TEMP/mig-cmake/bin" >> "$GITHUB_PATH"
            - name: Verify WebAssembly toolchain
              run: |
                  emcc --version
                  cmake --version
                  node --version
            - name: Build and validate the npm artifact
              run: |
                  cmake -P tools/bootstrap/bootstrap-web.cmake
                  node tools/bootstrap/bootstrap-browser.mjs
                  emcmake cmake -S . -B build/web -DMIG_BUILD_WEB=ON -DMIG_BUILD_TESTS=OFF -DMIG_BUILD_CONTROLLER=OFF -DMIG_BUILD_CONFIGURATOR=OFF
                  cmake --build build/web --parallel 2
                  node tests/bindings/javascript/web_tests.mjs
                  npm ci --ignore-scripts
                  npm run prepare:javascript
                  npm test
                  npm run test:types
                  npm run build:examples
                  node tools/bootstrap/bootstrap-node.mjs
                  mkdir -p build/releases
                  npm pack --workspace motion-input-grid --pack-destination build/releases
                  node tests/packaging/npm_package_tests.mjs build/releases/motion-input-grid-*.tgz
                  npm run package:examples
                  npx playwright install --with-deps chromium
                  python3 tests/packaging/standalone_browser_tests.py 'build/releases/*-browser-*-standalone.tar.gz'
                  python3 tests/packaging/package_artifact_tests.py build/releases/motion-input-grid-*-javascript-examples.tar.gz
                  python3 tests/packaging/release_archive_tests.py build/releases
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              id: candidates
              with:
                  name: motion-input-grid-npm-candidate
                  path: |
                      build/releases/
                      !build/releases/motion-input-grid-*-javascript-examples.tar.gz*
                      !build/releases/SHA256SUMS
                  retention-days: 3
                  if-no-files-found: error
                  compression-level: 1

    source:
        needs: metadata
        outputs:
            artifact-id: ${{ steps.candidates.outputs.artifact-id }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Propagate exact-tag package versions
              run: python3 tools/release/release-version.py --sync
            - name: Generate and validate the pinned vcpkg artifact
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y ninja-build pkg-config zip unzip curl
                  mkdir -p build
                  python3 tools/packaging/package-source.py
                  git init build/vcpkg-release-tool
                  git -C build/vcpkg-release-tool remote add origin https://github.com/microsoft/vcpkg.git
                  git -C build/vcpkg-release-tool fetch --depth 1 origin 434307da09bc05b2c86996dccc8b2351fc0d5d37
                  git -C build/vcpkg-release-tool checkout --detach FETCH_HEAD
                  build/vcpkg-release-tool/bootstrap-vcpkg.sh -disableMetrics
                  python3 tests/packaging/vcpkg_package_tests.py build/releases/motion-input-grid-*-vcpkg-overlay.tar.gz build/releases/motion-input-grid-*-source.tar.gz --vcpkg build/vcpkg-release-tool/vcpkg
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              id: candidates
              with:
                  name: motion-input-grid-source-and-vcpkg-candidates
                  path: build/releases/
                  retention-days: 3
                  if-no-files-found: error
                  compression-level: 1

    arm64:
        needs: metadata
        outputs:
            artifact-id: ${{ steps.candidates.outputs.artifact-id }}
        runs-on: ubuntu-24.04-arm
        container: ubuntu:22.04
        timeout-minutes: 30
        steps:
            - name: Install ARM64 package validation tools
              run: |
                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y git ca-certificates g++ python3-pip python3-venv libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1
                  python3 -m pip install cmake==3.31.10 build twine auditwheel patchelf
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Propagate exact-tag package versions
              run: python3 tools/release/release-version.py --sync
            - name: Build and install-test the ARM64 wheel
              run: |
                  cmake -P tools/bootstrap/bootstrap-web.cmake
                  python3 tools/packaging/package-python.py --dependencies build/native-deps --destination build/python-arm64
                  mkdir -p build/releases
                  auditwheel repair --plat manylinux_2_35_aarch64 build/python-arm64/*-linux_aarch64.whl -w build/releases
                  python3 tools/packaging/normalize-python-wheels.py build/releases/*-manylinux_2_35_aarch64.whl
                  python3 tests/packaging/python_package_tests.py build/releases/*-manylinux_2_35_aarch64.whl
                  python3 -m twine check build/releases/*.whl
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              id: candidates
              with:
                  name: motion-input-grid-arm64-python-candidate
                  path: build/releases/
                  retention-days: 3
                  if-no-files-found: error
                  compression-level: 1

    manifest:
        needs: [linux, windows, javascript, source, arm64]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Propagate exact-tag package versions
              run: python3 tools/release/release-version.py --sync
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: motion-input-grid-*-candidate*
                  path: build/release-candidates
                  merge-multiple: true
            - name: Verify contents and write the release inventory
              env:
                  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
              run: |
                  version=$(tr -d '\r\n' < VERSION)
                  for suffix in javascript-examples.tar.gz windows-x64-examples.zip linux-x64-examples.tar.gz; do
                      collection="build/release-candidates/motion-input-grid-$version-$suffix"
                      rm -f "$collection" "$collection.sha256"
                  done
                  python3 tests/packaging/package_artifact_tests.py build/release-candidates
                  python3 tools/release/release-manifest.py build/release-candidates ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
                  python3 tools/release/release-checksums.py build/release-candidates --check
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: motion-input-grid-release-candidates
                  path: build/release-candidates/
                  # Final candidates are reviewed and published manually.
                  retention-days: 7
                  if-no-files-found: error
                  compression-level: 1
            - name: Delete assembled intermediate Actions artifacts
              # A cleanup failure must not invalidate the verified final candidate.
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  ARTIFACT_IDS: ${{ format('{0} {1} {2} {3} {4}', needs.linux.outputs.artifact-id, needs.windows.outputs.artifact-id, needs.javascript.outputs.artifact-id, needs.source.outputs.artifact-id, needs.arm64.outputs.artifact-id) }}
              shell: bash
              run: |
                  # Only IDs from this run's five producer jobs; never release assets.
                  for artifact_id in $ARTIFACT_IDS; do
                      [[ "$artifact_id" =~ ^[0-9]+$ ]] || exit 1
                      echo "Deleting assembled intermediate Actions artifact $artifact_id from run $GITHUB_RUN_ID"
                      gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
                  done
