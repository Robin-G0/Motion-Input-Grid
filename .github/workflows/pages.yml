name: Test and publish the site

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        uses: ./.github/workflows/changes.yml

    build-and-test:
        needs: changes
        if: needs.changes.outputs.site == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        defaults:
            run:
                working-directory: site
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: site/package-lock.json
            - name: Install the locked site dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund
            - name: Build the static site
              run: npm run build
            - name: Test presence, carousel and real WASM gestures
              run: npm test
            - name: Install test browsers
              run: npx playwright install --with-deps chromium firefox
            - name: Install software graphics for browser tests
              run: sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl-mesa0
            # Firefox needs a display-backed GL context, even in headless mode.
            # Xvfb and Mesa let the real models run without a hardware GPU.
            - name: Test the built site in Chromium and Firefox
              env:
                  LIBGL_ALWAYS_SOFTWARE: '1'
              run: xvfb-run --auto-servernum npm run test:browser
            - name: Save browser failure traces
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: site-test-results
                  path: site/test-results/
                  retention-days: 7
                  if-no-files-found: ignore
            - name: Upload only the tested site
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
              with:
                  path: site/dist
                  # The deploy job consumes this artifact in the same run.
                  retention-days: 1

    deploy:
        needs: build-and-test
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure GitHub Pages
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
            - name: Deploy the tested artifact
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
