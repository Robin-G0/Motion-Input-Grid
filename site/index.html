<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Essayez Motion Input Grid : pilotez une présentation avec vos gestes, directement dans votre navigateur.">
    <meta name="theme-color" content="#0b101a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)">
    <title>Motion Input Grid : à vous de jouer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/main.mjs"></script>
</head>
<body>
    <svg class="visually-hidden" aria-hidden="true"><defs><symbol id="gesture-hand" viewBox="0 0 100 100"><path d="M30 82 L18 57 Q14 49 20 45 Q25 42 31 51 L34 55 V25 Q34 17 40 17 Q46 17 46 25 V45 V12 Q46 5 52 5 Q58 5 58 12 V44 V18 Q58 11 64 11 Q70 11 70 18 V47 V29 Q70 22 76 22 Q82 22 82 29 V64 Q82 83 68 91 H43 Q35 91 30 82Z"/></symbol></defs></svg>
    <div id="page-content">
        <header class="header">
            <nav data-label="navigation">
                <a data-link="repository" data-text="repository">Repository</a>
                <button class="theme-toggle" id="theme-toggle" type="button"></button>
                <div class="languages" aria-label="Language / Langue">
                    <button type="button" data-language="fr" lang="fr" aria-pressed="true">FR</button>
                    <button type="button" data-language="en" lang="en" aria-pressed="false">EN</button>
                </div>
            </nav>
        </header>
        <main>
            <section class="hero section" id="welcome">
                <div class="hero-copy">
                    <p class="eyebrow"><span class="prismatic-text" data-text="tagline">Le mouvement devient une interface.</span></p>
                    <h1 data-text="invitation">Alors, on teste tout ça ?</h1>
                    <p class="lead" data-text="introduction"></p>
                    <p id="phone-note" class="manual-hint" hidden></p>
                    <div class="camera-actions">
                        <button class="button primary" id="start-camera" type="button" data-text="start">Oui, on essaie !</button>
                        <div class="guided-start">
                            <button class="button gold" id="start-assisted" type="button" data-text="startAssisted" aria-describedby="start-assisted-hint"></button>
                            <span id="start-assisted-hint" data-text="startAssistedHint"></span>
                        </div>
                        <button class="button secondary" id="assistance-toggle" type="button" data-text="assistance" hidden></button>
                        <button class="button secondary" id="stop-camera" type="button" data-text="stop" hidden></button>
                    </div>
                    <p class="camera-placement" id="camera-placement" data-text="cameraPlacement" hidden></p>
                    <p class="privacy"><span data-text="privacy"></span> <a data-link="source" data-text="source"></a></p>
                </div>
                <aside class="camera-card" hidden>
                    <div class="camera-preview">
                        <div class="preview-decoration"><svg class="hand-pair" viewBox="0 0 220 100" aria-hidden="true"><use href="#gesture-hand" transform="translate(100 0) scale(-1 1)"/><use href="#gesture-hand" x="120"/></svg><p data-text="cameraHint"></p></div>
                        <video id="camera-video" muted playsinline></video>
                        <div class="camera-edge" data-camera-edge="top" hidden></div>
                        <div class="camera-edge" data-camera-edge="bottom" hidden></div>
                        <div class="camera-edge" data-camera-edge="left" hidden></div>
                        <div class="camera-edge" data-camera-edge="right" hidden></div>
                        <p id="camera-status" role="status" aria-live="polite"></p>
                        <canvas id="camera-overlay" aria-hidden="true" hidden></canvas>
                    </div>
                </aside>
            </section>

            <section class="section slideshow-section" id="presentation" aria-labelledby="slideshow-title">
                <p class="eyebrow" data-text="slideshowEyebrow"></p>
                <h2 id="slideshow-title" data-text="slideshowTitle"></h2>
                <div class="slide" id="slide" tabindex="0" role="region" aria-labelledby="slideshow-title" aria-roledescription="carousel">
                    <div class="slide-copy">
                        <p class="slide-tag" id="slide-tag"></p>
                        <h3 id="slide-title"></h3>
                        <p id="slide-description"></p>
                    </div>
                    <div class="slide-art">
                        <div class="history-illustration" id="history-illustration">
                            <div class="history-visual">
                                <svg viewBox="0 0 360 320" role="img"></svg>
                                <div class="history-grid" data-history-grid hidden>
                                    <svg class="grid-body" viewBox="0 0 360 300" aria-hidden="true"><circle cx="180" cy="50" r="23"/><path d="M180 73 V200 M90 125 L180 100 L270 125 M180 200 L135 275 M180 200 L225 275"/></svg>
                                    <button type="button" data-cell="first" data-label-key="firstCell">1<small>[2, 2]</small></button>
                                    <button type="button" data-cell="second" data-label-key="secondCell">2<small>[3, 2]</small></button>
                                    <button type="button" data-cell="cancel" data-label-key="cancelCell">×</button>
                                    <button type="button" data-cell="trigger" data-label-key="triggerCell">3</button>
                                    <button type="button" data-cell="condition" data-label-key="conditionCell"><span data-condition-content>3</span></button>
                                </div>
                            </div>
                            <p class="grid-outcome" data-history-outcome role="status" aria-live="polite"></p>
                            <label class="motion-control visually-hidden"><span data-history-motion-label></span><input type="range" min="0" max="100" value="0" step="1"></label>
                            <button class="animation-button visually-hidden" type="button" data-history-play></button>
                            <p class="illustration-status visually-hidden" data-history-status role="status" aria-live="polite"></p>
                        </div>
                        <span class="slide-number" id="slide-number" aria-hidden="true"></span>
                    </div>
                </div>
                <div class="slide-controls">
                    <button class="arrow-button" id="previous-slide" type="button" data-label="previous">←</button>
                    <span id="slide-counter" role="status" aria-live="polite" aria-atomic="true"></span>
                    <button class="arrow-button" id="next-slide" type="button" data-label="next">→</button>
                </div>
            </section>

            <section class="section presence-section" id="presence-demo" aria-labelledby="presence-title">
                <p class="eyebrow" data-text="presenceEyebrow"></p>
                <h2 id="presence-title" data-text="presenceTitle"></h2>
                <p class="lead" data-text="presenceDescription"></p>
                <p class="manual-hint" data-text="presenceNote"></p>
                <div class="departure-art" aria-hidden="true"><span>○</span><span>→</span><span>◎</span></div>
            </section>

            <section class="section finale" id="finale" hidden aria-labelledby="finale-title">
                <p class="eyebrow" data-text="finaleEyebrow"></p>
                <h2 id="finale-title" data-text="finaleTitle"></h2>
                <p data-text="finaleStar"></p>
                <a class="button secondary" data-link="repository" data-text="finaleLink"></a>
                <button class="button danger" id="finale-stop-camera" type="button" data-text="stop" hidden></button>
            </section>
            <div class="gesture-tip" id="scroll-gesture-tip" role="status" hidden><span class="gesture-arrow" aria-hidden="true">↑</span><span class="gesture-pictogram hand-up hand-up-left" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#gesture-hand" transform="translate(100 0) scale(-1 1)"/></svg></span><span class="visually-hidden" data-text="scrollShort"></span><span class="gesture-pictogram hand-up hand-up-right" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#gesture-hand"/></svg></span><p class="visually-hidden" data-text="scrollTip"></p></div>
            <div class="gesture-tip slide-tip" id="slide-gesture-tip" role="status" hidden><span class="gesture-pictogram hand-left directional-hand" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#gesture-hand" transform="translate(100 0) scale(-1 1)"/></svg></span><span class="visually-hidden" data-text="slideShort"></span><span class="gesture-pictogram hand-right directional-hand" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#gesture-hand"/></svg></span><p class="visually-hidden" data-text="slideTip"></p></div>
            <div class="gesture-tip" id="departure-tip" role="status" hidden><span class="gesture-pictogram person-leaving" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="42" cy="16" r="9"/><path d="M42 30 L36 55 L20 80 M36 55 L58 80 M40 35 L62 48 L77 40 M40 35 L20 48" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M70 70 H94 M84 60 L94 70 L84 80" fill="none" stroke="currentColor" stroke-width="5"/></svg></span><span class="visually-hidden" data-text="departureShort"></span><p class="visually-hidden" data-text="departureTip"></p></div>
            <div class="gesture-tip" id="cover-camera-tip" role="status" hidden><span class="gesture-pictogram hand-cover" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#gesture-hand"/></svg></span><span class="visually-hidden" data-text="coverShort"></span><p class="visually-hidden" data-text="coverCamera"></p></div>
            <div class="hands-tip" id="hands-tip" role="status" hidden><span class="gesture-pictogram" aria-hidden="true"><svg class="hand-pair" viewBox="0 0 220 100"><use href="#gesture-hand" transform="translate(100 0) scale(-1 1)"/><use href="#gesture-hand" x="120"/></svg></span><span class="visually-hidden" data-text="handsShort"></span><p class="visually-hidden" data-text="handsOutside"></p></div>
        </main>
        <footer class="footer">
            <p data-text="footerDescription"></p>
            <nav data-label="navigation">
                <a data-link="repository" data-text="repository"></a>
                <a data-link="downloads" data-text="downloads"></a>
                <a data-link="linkedin">LinkedIn ↗</a>
                <a data-link="github">GitHub ↗</a>
            </nav>
        </footer>
    </div>
    <section id="assistance" role="dialog" aria-modal="false" aria-labelledby="assistance-title" hidden>
        <div class="assistance-shade" aria-hidden="true"></div>
        <div class="assistance-target" data-assistance-target aria-hidden="true" hidden>
            <span class="aim-circle"></span>
            <svg class="aim-outline aim-left" viewBox="0 0 100 100"><use href="#gesture-hand" transform="translate(100 0) scale(-1 1)"/></svg>
            <svg class="aim-outline aim-right" viewBox="0 0 100 100"><use href="#gesture-hand"/></svg>
            <span class="aim-pointer" data-assistance-pointer hidden>
                <svg class="aim-hand" viewBox="0 0 100 100"><use href="#gesture-hand" transform="translate(100 0) scale(-1 1)"/></svg>
                <span class="aim-cross">+</span>
            </span>
            <span class="aim-pointer" data-assistance-pointer-right hidden>
                <svg class="aim-hand" viewBox="0 0 100 100"><use href="#gesture-hand"/></svg>
                <span class="aim-cross">+</span>
            </span>
        </div>
        <div class="assistance-gesture" data-assistance-gesture aria-hidden="true" hidden><svg viewBox="0 0 100 100"><use href="#gesture-hand"/></svg><span>→</span></div>
        <div class="assistance-bubble">
            <span class="assistance-bulb" aria-hidden="true">💡</span>
            <h2 id="assistance-title" data-assistance-title></h2>
            <p data-assistance-message aria-live="polite"></p>
            <p class="assistance-hint" data-assistance-hint hidden></p>
            <a data-assistance-source data-link="source" data-text="source"></a>
            <div class="assistance-actions"><button class="button primary" type="button" data-assistance-next></button><button class="button secondary" type="button" data-assistance-close></button></div>
        </div>
    </section>
    <div id="navigation-cooldown" role="progressbar" data-label="cooldownLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div data-cooldown-progress></div></div>
    <div id="navigation-edge" aria-hidden="true" hidden></div>
    <div id="away-screen" hidden>
        <p class="visually-hidden" data-text="away" role="status"></p>
        <!-- Well, you found it! But please try the regular way.
             This animation took a while to implement. Give it its two minutes of fame :) -->
        <div id="away-easter-egg" hidden>
            <canvas aria-hidden="true"></canvas>
            <div class="away-reward" data-away-reward role="status" hidden>
                <svg class="away-egg" viewBox="0 0 64 80" aria-hidden="true">
                    <defs><clipPath id="away-egg-shape"><path d="M32 4C20 4 6 31 6 49C6 66 17 76 32 76S58 66 58 49C58 31 44 4 32 4Z"/></clipPath></defs>
                    <g clip-path="url(#away-egg-shape)">
                        <rect width="64" height="80" fill="#eee3f6"/>
                        <path d="M0 20Q16 10 32 20T64 20V34Q48 44 32 34T0 34Z" fill="#ed9ea6"/>
                        <path d="M0 48Q16 38 32 48T64 48V62Q48 72 32 62T0 62Z" fill="#a9d0b6"/>
                        <circle cx="20" cy="42" r="3" fill="#f3c779"/><circle cx="44" cy="44" r="3" fill="#9dbfd6"/>
                    </g>
                </svg>
                <p data-text="wellPlayed"></p>
            </div>
        </div>
    </div>
    <noscript><p>Activez JavaScript pour essayer les gestes. / Enable JavaScript to try the gestures. <a href="https://github.com/Robin-G0/Motion-Input-Grid">GitHub</a></p></noscript>
</body>
</html>
