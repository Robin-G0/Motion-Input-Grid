<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="10" fill="#0b101a"/>
    <!-- Empty cells outside the gesture path. -->
    <g fill="#16202e" stroke="#303848" stroke-width="1">
        <rect x="6" y="42" width="16" height="16" rx="2"/>
        <rect x="24" y="6" width="16" height="16" rx="2"/>
        <rect x="42" y="6" width="16" height="16" rx="2"/>
    </g>
    <!-- Three green steps lead from the upper left to the gold trigger. -->
    <g fill="#b0e9b9">
        <rect x="6" y="6" width="16" height="16" rx="2"/>
        <rect x="6" y="24" width="16" height="16" rx="2"/>
        <rect x="24" y="24" width="16" height="16" rx="2"/>
    </g>
    <rect x="42" y="24" width="16" height="16" rx="2" fill="#e5b94f"/>
    <rect x="24" y="42" width="16" height="16" rx="2" fill="#ffc1bd"/>
    <rect x="42" y="42" width="16" height="16" rx="2" fill="#e8caff"/>
</svg>
